[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-bench"
version = "0.1.0"
description = "A local-first, AI-assisted API authorization testing framework."
readme = "README.md"
authors = [
    { name = "BoundaryBench Maintainers" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["security", "authorization", "bola", "idor", "fastapi", "ollama", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
boundary-bench = "boundary_bench.cli:main"

[tool.setuptools.packages.find]
include = ["boundary_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running local Ollama instance with gemma4:e2b",
]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]
